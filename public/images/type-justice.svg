  <ellipse cx="88" cy="190" rx="20" ry="14" fill="#1aa870" transform="rotate(-15 88 190)"/>
  <ellipse cx="192" cy="190" rx="20" ry="14" fill="#1aa870" transform="rotate(15 192 190)"/>
