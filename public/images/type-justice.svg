  <path d="M122,104 L136,107" stroke="#1a4a3a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M145,107 L159,104" stroke="#1a4a3a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cheeks -->
  <ellipse cx="120" cy="120" rx="7" ry="5" fill="#18a870" opacity="0.4"/>
  <ellipse cx="160" cy="120" rx="7" ry="5" fill="#18a870" opacity="0.4"/>
  <!-- Firm mouth/slight smile -->
  <path d="M131,126 Q140,132 149,126" stroke="#18a870" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Scale/balance symbol -->
  <line x1="140" y1="158" x2="140" y2="168" stroke="#1aa870" stroke-width="2"/>
  <line x1="118" y1="160" x2="162" y2="160" stroke="#1aa870" stroke-width="2.5"/>
