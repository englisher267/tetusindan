  <text x="48" y="72" font-size="18" opacity="0.75">⭐</text>
  <text x="200" y="65" font-size="16" opacity="0.7">⭐</text>
  <text x="215" y="165" font-size="14" opacity="0.6">✨</text>
  <text x="42" y="168" font-size="14" opacity="0.6">✨</text>
