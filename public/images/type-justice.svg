  </defs>
  <circle cx="140" cy="140" r="140" fill="url(#bg-j)"/>
  <!-- Robe/formal outfit -->
  <ellipse cx="140" cy="185" rx="54" ry="55" fill="#2ecb8f"/>
  <!-- Collar/robe details -->
  <path d="M115,148 L140,168 L165,148" fill="#1aa870" opacity="0.8"/>
  <!-- Body -->
  <ellipse cx="140" cy="195" rx="48" ry="48" fill="#2ecb8f"/>
  <!-- Head -->
  <circle cx="140" cy="115" r="33" fill="#2ecb8f"/>
  <!-- Ear -->
  <ellipse cx="124" cy="87" rx="8" ry="20" fill="#2ecb8f"/>
  <ellipse cx="124" cy="87" rx="4.5" ry="15" fill="#a0f0d8"/>
  <ellipse cx="156" cy="87" rx="8" ry="20" fill="#2ecb8f"/>
  <ellipse cx="156" cy="87" rx="4.5" ry="15" fill="#a0f0d8"/>
  <!-- Eyes (confident/sharp) -->
  <circle cx="129" cy="112" r="6.5" fill="white"/>
  <circle cx="151" cy="112" r="6.5" fill="white"/>
  <circle cx="131" cy="112" r="4" fill="#1a1a2e"/>
  <circle cx="153" cy="112" r="4" fill="#1a1a2e"/>
  <circle cx="132" cy="110.5" r="1.5" fill="white"/>
  <circle cx="154" cy="110.5" r="1.5" fill="white"/>
