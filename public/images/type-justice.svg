<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280">
  <defs>
    <radialGradient id="bg-j" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0fff5"/>
      <stop offset="100%" stop-color="#b8f0dc"/>
