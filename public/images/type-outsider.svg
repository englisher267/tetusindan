<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280">
  <defs>
    <radialGradient id="bg-o" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ede8ff"/>
      <stop offset="100%" stop-color="#d0c8ff"/>
    </radialGradient>
  </defs>
  <circle cx="140" cy="140" r="140" fill="url(#bg-o)"/>
  <!-- City silhouette (background) -->
  <rect x="40" y="195" width="25" height="50" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <rect x="70" y="180" width="20" height="65" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <rect x="95" y="200" width="30" height="45" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <rect x="175" y="185" width="22" height="60" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <rect x="202" y="195" width="28" height="50" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <rect x="232" y="175" width="18" height="70" fill="#b8aaf0" opacity="0.35" rx="2"/>
  <!-- Character body -->
  <ellipse cx="140" cy="178" rx="44" ry="52" fill="#9b8ef0"/>
  <!-- Head -->
  <circle cx="140" cy="120" r="33" fill="#9b8ef0"/>
  <!-- Ear -->
  <ellipse cx="125" cy="90" rx="8" ry="20" fill="#9b8ef0"/>
  <ellipse cx="125" cy="90" rx="4.5" ry="15" fill="#c8b8ff"/>
  <ellipse cx="155" cy="90" rx="8" ry="20" fill="#9b8ef0"/>
  <ellipse cx="155" cy="90" rx="4.5" ry="15" fill="#c8b8ff"/>
  <!-- Eyes (looking sideways/away) -->
  <circle cx="130" cy="116" r="6" fill="white"/>
  <circle cx="150" cy="116" r="6" fill="white"/>
  <circle cx="128" cy="116" r="3.5" fill="#1a1a2e"/>
  <circle cx="148" cy="116" r="3.5" fill="#1a1a2e"/>
  <circle cx="128.5" cy="114.5" r="1.2" fill="white"/>
  <circle cx="148.5" cy="114.5" r="1.2" fill="white"/>
  <!-- Small sad/neutral mouth -->
  <path d="M133,128 Q140,132 147,128" stroke="#7060c0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks (subtle) -->
  <ellipse cx="121" cy="124" rx="6" ry="4" fill="#7060c0" opacity="0.3"/>
  <ellipse cx="159" cy="124" rx="6" ry="4" fill="#7060c0" opacity="0.3"/>
  <!-- Arms at sides/crossed -->
  <ellipse cx="96" cy="183" rx="18" ry="13" fill="#8a7de0" transform="rotate(-10 96 183)"/>
  <ellipse cx="184" cy="183" rx="18" ry="13" fill="#8a7de0" transform="rotate(10 184 183)"/>
  <!-- Stars/dots floating -->
  <circle cx="60" cy="90" r="3" fill="#9b8ef0" opacity="0.5"/>
  <circle cx="55" cy="75" r="2" fill="#9b8ef0" opacity="0.4"/>
  <circle cx="225" cy="88" r="3" fill="#9b8ef0" opacity="0.5"/>
  <circle cx="230" cy="72" r="2" fill="#9b8ef0" opacity="0.4"/>
  <!-- Thought bubble -->
  <circle cx="185" cy="55" r="18" fill="white" opacity="0.7"/>
  <text x="176" y="62" font-size="16" opacity="0.8">…</text>
  <circle cx="170" cy="78" r="6" fill="white" opacity="0.6"/>
  <circle cx="161" cy="88" r="3.5" fill="white" opacity="0.5"/>
  <text x="44" y="52" font-size="16" opacity="0.6">🌑</text>
</svg>
